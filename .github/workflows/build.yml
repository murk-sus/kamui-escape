name: Build KAMUI IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Find iOS SDK
        id: sdk
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "path=$SDK" >> "$GITHUB_OUTPUT"
          echo "Using SDK: $SDK"

      - name: Build
        env:
          SDK: ${{ steps.sdk.outputs.path }}
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          APP_NAME="BQTool"
          VERSION="2.4.3"
          BID="com.kamui.escape"
          BUILD="$ROOT/build"
          APP="$BUILD/Payload/$APP_NAME.app"

          mkdir -p "$APP"

          echo "[*] SDK: $SDK"
          echo "[*] compiling..."
          clang \
              -target arm64-apple-ios14.0 \
              -isysroot "$SDK" \
              -fobjc-arc -fblocks -O2 \
              -Wall -Wno-unused-parameter -Wno-deprecated-declarations \
              -framework UIKit \
              -framework Foundation \
              -framework CoreFoundation \
              -framework CoreGraphics \
              -framework WebKit \
              -lz \
              "$ROOT/src/main.m" \
              "$ROOT/src/AppDelegate.m" \
              "$ROOT/src/RootTabBarController.m" \
              "$ROOT/src/GestaltVC.m" \
              "$ROOT/src/CacheExtraEditVC.m" \
              "$ROOT/src/PosterBoardVC.m" \
              "$ROOT/src/TendiesExploreVC.m" \
              "$ROOT/src/SettingsVC.m" \
              "$ROOT/src/LogVC.m" \
              "$ROOT/src/BQUI.m" \
              "$ROOT/src/BQCore.m" \
              -o "$APP/$APP_NAME"

          cp "$ROOT/src/Info.plist" "$APP/Info.plist"
          cp "$ROOT/src/respring.html" "$APP/respring.html"
          for lproj in "$ROOT"/src/*.lproj; do
              [ -d "$lproj" ] && cp -R "$lproj" "$APP/"
          done

          echo "[*] packing..."
          cd "$BUILD"
          zip -qry "KAMUI-$VERSION.ipa" Payload
          echo "[*] done: $BUILD/KAMUI-$VERSION.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KAMUI-2.4.3
          path: build/KAMUI-2.4.3.ipa
